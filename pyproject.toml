[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-agent"
version = "0.1.0"
description = "AI-assisted pre-simulation literature + evidence layer for BEAM (rule-based expand/search/filter so far; LLM extraction and decision support planned)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["beam_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
