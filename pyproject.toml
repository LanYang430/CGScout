[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-agent"
version = "0.1.0"
description = "AI-assisted pre-simulation literature + evidence layer for BEAM (rule-based resolve/plan/search/filter through Stage 3; single-pass LLM-backed evidence extraction at Stage 4a; deterministic System/Process/Method matching and ranking at Stage 4b/5)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["beam_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
