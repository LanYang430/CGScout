[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-literature"
version = "0.1.0"
description = "Phase 1 (search-only) pre-simulation literature layer for BEAM"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["beam_literature*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
